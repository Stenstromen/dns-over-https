---
version: '3'
services:
  doh:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8053:8053/tcp"
      - "8053:8053/udp"
    environment:
      - UPSTREAM_DNS_SERVER=tcp:208.67.222.222:53
      # Optional: used only when the preferred upstream is unreachable
      # - BACKUP_UPSTREAM_DNS_SERVER=udp:1.1.1.1:53
      # - BACKUP_RETRY_INTERVAL=30
      - DOH_HTTP_PREFIX=/getnsrecord
      - DOH_SERVER_LISTEN_PORT=8053
      - REDIS_URL=redis:6379
      - DOH_SERVER_TIMEOUT=10
      - DOH_SERVER_TRIES=3
      - DOH_SERVER_VERBOSE=false
    depends_on:
      - redis

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    command: redis-server --loglevel debug
